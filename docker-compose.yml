version: '3.8'

services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml               # สำคัญสำหรับ WebRTC UDP ports              
    environment:
      - REDIS_ADDRESS=redis:6379
    ports:
      - "17880:17880"     # WebSocket/HTTP API
      - "17881:17881"     # TCP for signaling
      - "50700-50720:50700-50720/udp" # UDP for media (WebRTC)                    # http (optional)            
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml  # Mount LiveKit configuration
    networks:
      - livekit-network
    depends_on:
      - redis  # Redis required for LiveKit clustering/state
  redis:
    image: redis:alpine
    restart: always
    networks:
      - livekit-network
